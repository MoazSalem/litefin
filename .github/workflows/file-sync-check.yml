name: Check File Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at midnight to check for updates
  workflow_dispatch:     # Allows you to click a button in the Web UI to run it manually

jobs:
  check-sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write              # Grants permission to create the notification issue
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Fetch upstream file and compare
        id: compare
        run: |
          # 1. Fetch the exact live file from the upstream repository
          curl -s https://githubusercontent.com -o upstream-en-us.json
          
          # 2. Compare it against your fork's file safely without crashing the runner
          if git diff --no-index --quiet upstream-en-us.json src/locales/en-gb.json; then
            echo "Files are perfectly synced."
          else
            echo "Files are out of sync!"
            echo "out_of_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Create an issue to notify you
        if: steps.compare.outputs.out_of_sync == 'true'
        run: |
          gh issue create \
            --title "Action Required: Translation files are out of sync" \
            --body "The upstream file 'en-us.json' on MoazSalem/litefin has changed or diverged from your 'en-gb.json' file. Please review and pull updates." \
            --assignee "${{ github.actor }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
