name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create empty sign directory
        run: mkdir -p .sign

      - name: Build all packages
        run: npm run package

      - name: Generate Homebrew Manifest
        id: manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPK_FILE="Litefin-${VERSION}-legacy-webos.ipk"
          SHA256=$(sha256sum "$IPK_FILE" | cut -d ' ' -f 1)
          
          cat <<EOF > manifest.json
          {
            "id": "org.litefin.app",
            "version": "$VERSION",
            "type": "web",
            "title": "Litefin",
            "appDescription": "Native Jellyfin client for WebOS",
            "iconUri": "https://raw.githubusercontent.com/MoazSalem/litefin/development/icon-130.png",
            "sourceUrl": "https://github.com/MoazSalem/litefin",
            "rootRequired": false,
            "ipkUrl": "$IPK_FILE",
            "ipkHash": {
              "sha256": "$SHA256"
            }
          }
          EOF

      - name: Read Release Footer
        id: footer
        run: |
          content=$(cat .github/RELEASE_NOTES_FOOTER.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.footer.outputs.content }}
          generate_release_notes: true
          files: |
            *.wgt
            *.ipk
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
