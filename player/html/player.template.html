<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Jellyfin Video Player">
    <title>Jellyfin Player</title>
    <style>
        /* Critical inline styles for immediate rendering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .loading-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00a4dc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Player Container -->
    <div id="player-container">
        <div class="loading-screen" id="loading-screen">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script>
        // Parse config from URL params or window.playerConfig
        (function () {
            const params = new URLSearchParams(window.location.search);

            window.playerConfig = window.playerConfig || {
                serverUrl: params.get('serverUrl') || '',
                authToken: params.get('authToken') || '',
                itemId: params.get('itemId') || '',
                startPositionTicks: parseInt(params.get('startPosition') || '0', 10),
                useTizenPlayer: params.get('tizen') === 'true'
            };

            // Hide loading screen when player is ready
            if (window.JellyfinPlayer) {
                document.getElementById('loading-screen').style.display = 'none';
            }
        })();

        // Auto-initialize when bundle loads
        document.addEventListener('DOMContentLoaded', () => {
            // Check if the bundle exposed the global object
            // The default export from index.js is assigned to window.JellyfinPlayer by webpack libraryTarget output?
            // Actually, our index.js does: window.JellyfinPlayerInstance = player; inside init()
            // But the UMD/library export usually attaches the module exports to the global variable name provided in webpack config.

            // Let's assume webpack output.library.name = 'JellyfinPlayer'.
            // Then window.JellyfinPlayer is the default export object containing { JellyfinPlayer, SettingsManager, init... }

            if (window.JellyfinPlayer && window.JellyfinPlayer.init) {
                console.log('[PlayerTemplate] Auto-initializing player...');
                const player = window.JellyfinPlayer.init(window.playerConfig);

                // Hide loader
                const loader = document.getElementById('loading-screen');
                if (loader) loader.style.display = 'none';
            } else {
                console.error('[PlayerTemplate] JellyfinPlayer not found on window!');
            }
        });
    </script>

    <!-- Player bundle will be injected here by webpack -->
</body>

</html>
