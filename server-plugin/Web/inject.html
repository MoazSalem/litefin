<!--
================================================================================
Litefin Quick-Access Header Launcher Styles & Script Injection
================================================================================
- Perfectly circular 1:1 button matching native Jellyfin Web toolbar icons.
- Tactile spring animations on hover and press for fluid toolbar responsiveness.
- Responsive, crisp rendering across desktop, tablet, and mobile views.
- Zero-dependency injection into Jellyfin Web.
================================================================================
-->
<style>
.headerLitefinButton {
    /* Enforce strict 1:1 square dimensions for a perfectly round hover circle */
    width: 48px !important;
    height: 48px !important;
    min-width: 48px !important;
    min-height: 48px !important;
    max-width: 48px !important;
    max-height: 48px !important;
    aspect-ratio: 1 / 1 !important;
    box-sizing: border-box !important;
    align-self: center !important;
    padding: 12px !important;
    margin: 0 !important;
    border-radius: 50% !important;

    /* Transparency, transitions, and reset */
    opacity: 0.85;
    transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                background-color 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    border: none !important;
    outline: none !important;
    background: transparent !important;
    box-shadow: none !important;
    cursor: pointer;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: inherit !important;
    vertical-align: middle !important;
    flex-shrink: 0 !important;
    transform: scale(1);
    -webkit-tap-highlight-color: transparent;
}

.headerLitefinButton:hover {
    opacity: 1 !important;
    background-color: rgba(255, 255, 255, 0.15) !important;
    transform: scale(1.08) !important;
}

.headerLitefinButton:active {
    opacity: 0.9 !important;
    transform: scale(0.92) !important;
    transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1) !important;
}

.headerLitefinButton:focus,
.headerLitefinButton:focus-visible {
    outline: none !important;
    box-shadow: none !important;
}

.headerLitefinButton img {
    width: 24px !important;
    height: 24px !important;
    border-radius: 4px;
    vertical-align: middle;
    display: block;
    pointer-events: none;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
}
