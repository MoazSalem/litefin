<!DOCTYPE html>
<html lang="en" data-theme="purplehaze" data-layout="classic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Litefin - Native Jellyfin Client for Samsung Tizen TVs">
    <title>Litefin</title>
    <!--
        WebOS SDK — must load before any app JS so that window.webOS and
        window.webOS.service are available when ApiClient runs its Luna check.
        On Tizen and standard browsers this script detects a non-WebOS environment
        and is effectively a no-op.
    -->
    <script src="js/webOSTV.js"></script>
</head>

    <script>
        // ====================================================================
        // STARTUP ERROR CATCHER (ES5 ONLY — must run on Tizen 3.0+)
        // ====================================================================
        // Catches any JS errors during initial bundle loading, including
        // SyntaxErrors from unsupported ES6+ features on older WebViews.
        // Renders a full-screen diagnostic overlay so we can actually see
        // what went wrong on a TV with no DevTools access.
        // ====================================================================
        (function() {
            // Track whether the app successfully bootstrapped
            var appLoaded = false;

            // Mark app as loaded once the main bundle finishes executing
            // (index.js sets this at the end of its bootstrap sequence)
            window.__litefin_mark_loaded = function() {
                appLoaded = true;
            };

            // ----------------------------------------------------------------
            // Render a full-screen error overlay with diagnostic info
            // ----------------------------------------------------------------
            function showErrorOverlay(title, details) {
                // Only show once — don't spam overlays for cascading errors
                if (document.getElementById('startup-error-overlay')) return;

                var overlay = document.createElement('div');
                overlay.id = 'startup-error-overlay';
                overlay.style.cssText = [
                    'position: fixed',
                    'top: 0',
                    'left: 0',
                    'right: 0',
                    'bottom: 0',
                    'z-index: 2147483647',
                    'background: #1a1a2e',
                    'color: #e0e0e0',
                    'font-family: monospace, sans-serif',
                    'font-size: 18px',
                    'padding: 40px 60px',
                    'overflow-y: auto',
                    'box-sizing: border-box'
                ].join(';');

                // Build the error display content
                var html = '';
                html += '<div style="margin-bottom: 24px;">';
                html += '<span style="font-size: 36px;">&#9888;</span> '; // Warning icon
                html += '<span style="font-size: 28px; font-weight: bold; color: #ff6b6b;">';
                html += title;
                html += '</span>';
                html += '</div>';

                // Error details box
                html += '<div style="';
                html += 'background: #0f0f23;';
                html += 'border: 1px solid #333;';
                html += 'border-radius: 8px;';
                html += 'padding: 20px 24px;';
                html += 'margin-bottom: 24px;';
                html += 'white-space: pre-wrap;';
                html += 'word-break: break-word;';
                html += 'line-height: 1.6;';
                html += 'font-size: 16px;';
                html += '">';
                html += details;
                html += '</div>';

                // User agent info for diagnostics
                html += '<div style="color: #888; font-size: 14px; margin-top: 16px;">';
                html += '<strong>User Agent:</strong> ' + navigator.userAgent;
                html += '</div>';

                overlay.innerHTML = html;

                // Hide the splash spinner so the error is clearly visible
                var splash = document.getElementById('app-splash');
                if (splash) splash.style.display = 'none';

                document.body.appendChild(overlay);
            }

            // ----------------------------------------------------------------
            // Global error handler — catches runtime errors AND parse errors
            // when the browser attempts to evaluate the bundled script
            // ----------------------------------------------------------------
            window.onerror = function(message, source, lineno, colno, error) {
                // Skip if the app already loaded successfully
                // (post-load errors are handled by the app's own error handling)
                if (appLoaded) return;

                var details = '';
                details += '<span style="color: #ff6b6b;">' + (message || 'Unknown error') + '</span>\n\n';

                if (source) {
                    details += '<strong>Source:</strong> ' + source + '\n';
                }
                if (lineno) {
                    details += '<strong>Line:</strong> ' + lineno;
                    if (colno) details += ', <strong>Col:</strong> ' + colno;
                    details += '\n';
                }
                if (error && error.stack) {
                    details += '\n<strong>Stack Trace:</strong>\n';
                    details += error.stack;
                }

                showErrorOverlay('Startup Error', details);
            };

            // ----------------------------------------------------------------
            // Unhandled promise rejection handler — catches async failures
            // during bootstrap (e.g. failed fetch, import errors)
            // ----------------------------------------------------------------
            if (typeof window.addEventListener === 'function') {
                window.addEventListener('unhandledrejection', function(event) {
                    if (appLoaded) return;

                    var reason = event.reason || {};
                    var details = '';

                    if (typeof reason === 'string') {
                        details += '<span style="color: #ff6b6b;">' + reason + '</span>\n';
                    } else {
                        details += '<span style="color: #ff6b6b;">';
                        details += (reason.message || 'Unhandled Promise Rejection');
                        details += '</span>\n';

                        if (reason.stack) {
                            details += '\n<strong>Stack Trace:</strong>\n';
                            details += reason.stack;
                        }
                    }

                    showErrorOverlay('Async Startup Error', details);
                });
            }

            // ----------------------------------------------------------------
            // Safety net: if the app hasn't loaded after 15 seconds,
            // something went very wrong — show a timeout diagnostic
            // ----------------------------------------------------------------
            setTimeout(function() {
                if (!appLoaded && !document.getElementById('startup-error-overlay')) {
                    showErrorOverlay(
                        'Startup Timeout',
                        '<span style="color: #ffa94d;">The application did not finish loading within 15 seconds.</span>\n\n' +
                        'This may indicate:\n' +
                        '  - A JavaScript syntax error the browser could not report\n' +
                        '  - A network issue loading required resources\n' +
                        '  - An incompatible WebView version\n\n' +
                        'Check the console output for more details.'
                    );
                }
            }, 15000);
        })();
    </script>

    <script>
        // Immediately restore theme to prevent flash of wrong color
        (function() {
            try {
                var savedTheme = localStorage.getItem('litefin:theme') || 'purplehaze';
                document.documentElement.setAttribute('data-theme', savedTheme);

                // Theme variables for early loading (must match CSS)
                var themes = {
                    'dark': { accent: '#00a4dc', bg: '#101010' },
                    'light': { accent: '#00a4dc', bg: '#f5f5f5' },
                    'blueradiance': { accent: '#00b4d8', bg: '#0a0f1a' },
                    'purplehaze': { accent: '#b24bf3', bg: '#0f0a14' },
                    'wmc': { accent: '#52b043', bg: '#0a120a' },
                    'appletv': { accent: '#0a84ff', bg: '#000000' }
                };

                var currentTheme = themes[savedTheme] || themes['dark'];
                document.documentElement.style.setProperty('--jf-accent', currentTheme.accent);
                document.documentElement.style.setProperty('--jf-background', currentTheme.bg);
            } catch (e) {
                console.error('Error restoring theme:', e);
            }
        })();
    </script>
    <style>
        body,
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--jf-background, #101010);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--jf-font-family);
            overflow: hidden;
        }

        .splash-content {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 2147483647; /* Absolute max z-index */
            background-color: var(--jf-background, #101010);
            transition: opacity 0.4s ease-out;
            transform: translateZ(0); /* Hardware accelerate to compete with sidebar */
            will-change: opacity;
        }

        .splash-content.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .page-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 2000;
            background-color: transparent;
        }

        .page.loading .page-loading {
            display: block;
        }

        /* Hide the internal spinner if the global one is still up, 
           but keep the layout active to block clicks */
        body.app-splash-active .page-loading .loading-spinner {
            opacity: 0;
        }

        .page-loading.hidden {
            display: none !important;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -24px;
            margin-left: -24px;
            color: #FFF;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            /* TIZEN PERF: Promote to its own compositor layer so the rotation
               animation runs on the GPU, independent of main-thread JS work. */
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .loading-spinner::after,
        .loading-spinner::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            transform: scale(0.5) translate(0, 0);
            background-color: #FFF;
            border-radius: 50%;
            animation: animloader 1s infinite ease-in-out;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .loading-spinner::before {
            background-color: var(--jf-accent, #00a4dc);
            /* Use JF Accent color instead of static red */
            transform: scale(0.5) translate(-48px, -48px);
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes animloader {
            50% {
                transform: scale(1) translate(-50%, -50%);
            }
        }
    </style>
</head>

<body class="app-splash-active">
    <!-- Main application container -->
    <div id="app">
        <!-- Loading screen shown before JS loads -->
        <div id="app-splash" class="splash-content">
            <div class="loading-spinner"></div>
        </div>
    </div>

</body>

</html>
