<!DOCTYPE html>
<html lang="en" data-theme="purplehaze" data-layout="classic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Litefin - Native Jellyfin Client for Samsung Tizen TVs">
    <title>Litefin</title>
</head>

    <script>
        // Immediately restore theme to prevent flash of wrong color
        (function() {
            try {
                const savedTheme = localStorage.getItem('litefin:theme') || 'purplehaze';
                document.documentElement.setAttribute('data-theme', savedTheme);

                // Theme variables for early loading (must match CSS)
                const themes = {
                    'dark': { accent: '#00a4dc', bg: '#101010' },
                    'light': { accent: '#00a4dc', bg: '#f5f5f5' },
                    'blueradiance': { accent: '#00b4d8', bg: '#0a0f1a' },
                    'purplehaze': { accent: '#b24bf3', bg: '#0f0a14' },
                    'wmc': { accent: '#52b043', bg: '#0a120a' },
                    'appletv': { accent: '#0a84ff', bg: '#000000' }
                };

                const currentTheme = themes[savedTheme] || themes['dark'];
                document.documentElement.style.setProperty('--jf-accent', currentTheme.accent);
                document.documentElement.style.setProperty('--jf-background', currentTheme.bg);
            } catch (e) {
                console.error('Error restoring theme:', e);
            }
        })();
    </script>
    <style>
        body,
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--jf-background, #101010);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--jf-font-family);
            overflow: hidden;
        }

        .splash-content {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 9999;
            background-color: var(--jf-background, #101010);
        }

        .page-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 9999;
            background-color: var(--jf-background, #101010);
        }

        .page.loading .page-loading {
            display: block;
        }

        .page-loading.hidden {
            display: none !important;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -24px;
            margin-left: -24px;
            color: #FFF;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            /* TIZEN PERF: Promote to its own compositor layer so the rotation
               animation runs on the GPU, independent of main-thread JS work. */
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .loading-spinner::after,
        .loading-spinner::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            transform: scale(0.5) translate(0, 0);
            background-color: #FFF;
            border-radius: 50%;
            animation: animloader 1s infinite ease-in-out;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .loading-spinner::before {
            background-color: var(--jf-accent, #00a4dc);
            /* Use JF Accent color instead of static red */
            transform: scale(0.5) translate(-48px, -48px);
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes animloader {
            50% {
                transform: scale(1) translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <!-- Main application container -->
    <div id="app">
        <!-- Loading screen shown before JS loads -->
        <div class="splash-content">
            <div class="loading-spinner"></div>
        </div>
    </div>

</body>

</html>
